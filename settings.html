<!DOCTYPE html>
<html lang="en" data-title="settingsTitle">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Settings · World Clock</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="theme-color" content="#0a0e1a">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <script src="theme.js"></script>
</head>
<body class="settings-page">
    <header class="topbar">
        <a href="index.html" class="back" id="back">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            <span data-i18n="back"></span>
        </a>
        <h1 class="brand" data-i18n="settings"></h1>
        <span class="topbar-spacer"></span>
    </header>

    <main class="wrap narrow">
        <section class="card section">
            <h2 data-i18n="places"></h2>
            <p class="hint" data-i18n-html="placesHintHtml"></p>

            <div class="search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" autocomplete="off" spellcheck="false"
                       role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
                <ul id="results" class="results" role="listbox" hidden></ul>
            </div>

            <ol id="places" class="places"></ol>
            <p id="places-empty" class="hint empty-list" data-i18n="placesEmpty" hidden></p>
        </section>

        <section class="card section">
            <h2 data-i18n="hours"></h2>
            <p class="hint" data-i18n="hoursHint"></p>
            <div id="global-hours"></div>
        </section>

        <section class="card section">
            <h2 data-i18n="display"></h2>
            <div class="row">
                <span class="row-label" data-i18n="language"></span>
                <div class="segmented" role="radiogroup" data-i18n-aria="language">
                    <button type="button" role="radio" data-lang-choice="auto" data-i18n="langAuto"></button>
                    <button type="button" role="radio" data-lang-choice="en" lang="en">English</button>
                    <button type="button" role="radio" data-lang-choice="no" lang="nb">Norsk</button>
                </div>
            </div>
            <div class="row">
                <span class="row-label" data-i18n="theme"></span>
                <div class="segmented" role="radiogroup" data-i18n-aria="theme">
                    <button type="button" role="radio" data-theme-choice="auto" data-i18n="themeAuto"></button>
                    <button type="button" role="radio" data-theme-choice="light" data-i18n="themeLight"></button>
                    <button type="button" role="radio" data-theme-choice="dark" data-i18n="themeDark"></button>
                    <button type="button" role="radio" data-theme-choice="hacker" data-i18n="themeHacker"></button>
                </div>
            </div>
            <div class="row">
                <span class="row-label" data-i18n="timeFormat"></span>
                <div class="segmented" role="radiogroup" data-i18n-aria="timeFormat">
                    <button type="button" role="radio" data-format="24" data-i18n="h24"></button>
                    <button type="button" role="radio" data-format="12" data-i18n="h12"></button>
                </div>
            </div>
            <div class="row">
                <label class="row-label" for="seconds">
                    <span data-i18n="seconds"></span>
                    <small data-i18n="secondsNote"></small>
                </label>
                <label class="switch"><input type="checkbox" id="seconds" data-toggle="seconds"><span></span></label>
            </div>
            <div class="row">
                <label class="row-label" for="show-local">
                    <span data-i18n="showLocal"></span>
                    <small data-i18n="showLocalNote"></small>
                </label>
                <label class="switch"><input type="checkbox" id="show-local" data-toggle="showLocal"><span></span></label>
            </div>
            <div class="row">
                <label class="row-label" for="show-clocks">
                    <span data-i18n="showClocks"></span>
                    <small data-i18n="showClocksNote"></small>
                </label>
                <label class="switch"><input type="checkbox" id="show-clocks" data-toggle="showClocks"><span></span></label>
            </div>
            <div class="row">
                <span class="row-label">
                    <span data-i18n="protection"></span>
                    <small id="protection-note"></small>
                </span>
                <div class="row-controls">
                    <button type="button" class="btn ghost small" id="preview" data-i18n="preview" hidden></button>
                    <div class="segmented" role="radiogroup" data-i18n-aria="protection">
                        <button type="button" role="radio" data-protection="none" data-i18n="protNone"></button>
                        <button type="button" role="radio" data-protection="gentle" data-i18n="protGentle"></button>
                        <button type="button" role="radio" data-protection="flash" data-i18n="protFlash"></button>
                    </div>
                </div>
            </div>
        </section>

        <section class="card section">
            <div class="row flat">
                <span class="row-label">
                    <span data-i18n="share"></span>
                    <small data-i18n="shareNote"></small>
                </span>
                <button type="button" class="btn small" id="share" data-i18n="shareBtn"></button>
            </div>
            <div class="row">
                <span class="row-label">
                    <span data-i18n="reset"></span>
                    <small data-i18n="resetNote"></small>
                </span>
                <button type="button" class="btn ghost small danger" id="reset" data-i18n="resetBtn"></button>
            </div>
        </section>

        <footer class="footer">
            <a href="https://github.com/gunnaringe/world-clock" rel="noopener">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
                gunnaringe/world-clock
            </a>
        </footer>
    </main>

    <script src="i18n.js"></script>
    <script src="common.js"></script>
    <script src="settings.js"></script>
</body>
</html>
