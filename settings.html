<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Settings · World Clock</title>
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
</head>
<body class="settings-page">
    <header class="topbar">
        <a href="index.html" class="back" id="back">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            Clock
        </a>
        <h1 class="brand">Settings</h1>
        <span class="topbar-spacer"></span>
    </header>

    <main class="wrap narrow">
        <section class="card section">
            <h2>Places</h2>
            <p class="hint">Search for a city, a time zone like <em>America/Denver</em>, or an offset like <em>UTC+5</em>.</p>

            <div class="search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                <input id="search" type="search" placeholder="Add a city…" autocomplete="off" spellcheck="false"
                       role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
                <ul id="results" class="results" role="listbox" hidden></ul>
            </div>

            <ol id="places" class="places"></ol>
            <p id="places-empty" class="hint empty-list" hidden>No places yet. Search above to add one.</p>
        </section>

        <section class="card section">
            <h2>Display</h2>
            <div class="row">
                <span class="row-label">Theme</span>
                <div class="segmented" role="radiogroup" aria-label="Theme">
                    <button type="button" role="radio" data-theme-choice="auto">Auto</button>
                    <button type="button" role="radio" data-theme-choice="light">Light</button>
                    <button type="button" role="radio" data-theme-choice="dark">Dark</button>
                    <button type="button" role="radio" data-theme-choice="hacker">Hacker</button>
                </div>
            </div>
            <div class="row">
                <span class="row-label">Time format</span>
                <div class="segmented" role="radiogroup" aria-label="Time format">
                    <button type="button" role="radio" data-format="24">24-hour</button>
                    <button type="button" role="radio" data-format="12">12-hour</button>
                </div>
            </div>
            <div class="row">
                <label class="row-label" for="flash">
                    Burn-in protection
                    <small>Flashes the screen briefly every 30 minutes</small>
                </label>
                <div class="row-controls">
                    <button type="button" class="btn ghost small" id="preview">Preview</button>
                    <label class="switch"><input type="checkbox" id="flash"><span></span></label>
                </div>
            </div>
        </section>
    </main>

    <script src="common.js"></script>
    <script src="settings.js"></script>
</body>
</html>
