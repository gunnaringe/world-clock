<!DOCTYPE html>
<html lang="en" data-title="appTitle">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>World Clock</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="theme-color" content="#0a0e1a">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <script src="theme.js"></script>
</head>
<body>
    <div class="decor" aria-hidden="true">
        <span class="d-snow"></span>
        <span class="d-lights"></span>
        <span class="d-glow"></span>
        <span class="d-star"></span>
        <span class="d-tree l2"></span>
        <span class="d-tree l1"></span>
        <span class="d-nativity"></span>
        <span class="d-tree r1"></span>
        <span class="d-tree r2"></span>
    </div>
    <div class="decor front" aria-hidden="true">
        <!-- Elves: inline so their arms, eyes and legs can move with CSS. -->
        <span class="d-elf swing"><svg viewBox="0 0 60 110">
            <path d="M21 48 23 9M39 48l-2-39" stroke="#2f9e63" stroke-width="6" stroke-linecap="round"/>
            <circle cx="23" cy="6" r="4.5" fill="#e5484d"/><circle cx="37" cy="6" r="4.5" fill="#e5484d"/>
            <g class="e-kick" style="transform-origin: 34px 76px">
                <path d="M34 76l7 15" stroke="#fbf4e2" stroke-width="6" stroke-linecap="round"/>
                <path d="M34 76l7 15" stroke="#e5484d" stroke-width="6" stroke-dasharray="3.5 3.5"/>
                <path d="M37.5 90.5 43 92c2.5.5 4.5 0 6.5-2.5 1 3.5-1 7-4.5 7.5l-4 .5c-3 .3-5-2.5-3.5-6.5Z" fill="#2f9e63"/><circle cx="50" cy="89" r="2" fill="#f2c14e"/>
            </g>
            <path d="M26 76v18" stroke="#fbf4e2" stroke-width="6" stroke-linecap="round"/>
            <path d="M26 76v18" stroke="#e5484d" stroke-width="6" stroke-dasharray="3.5 3.5"/>
            <path d="M29.5 93v3c0 2-2 3.5-5 3.5h-6c-3 0-5-2-6.5-5.5 2 1 4.5 1 6.5-1Z" fill="#2f9e63"/><circle cx="12" cy="94" r="2" fill="#f2c14e"/>
            <path d="M20 46h20l5 30-5-3-5 4-5-4-5 4-5-4-5 3Z" fill="#2f9e63"/>
            <rect x="19" y="62" width="22" height="4" fill="#3b2a1a"/><rect x="27" y="61" width="6" height="6" fill="none" stroke="#f2c14e" stroke-width="1.6"/>
            <path d="M19 34 12 27l9 13ZM41 34l7-7-9 13Z" fill="#f1cfa6"/>
            <circle cx="30" cy="35" r="11" fill="#f1cfa6"/>
            <path d="M24 34q2.5-3 5 0M31 34q2.5-3 5 0" stroke="#2b2118" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M25 39q5 6 10 0Z" fill="#7a2630"/>
            <circle cx="22" cy="39" r="2.4" fill="#f08a8a" opacity="0.7"/><circle cx="38" cy="39" r="2.4" fill="#f08a8a" opacity="0.7"/>
            <path d="M18 30c1-12 10-18 21-16 8 2 13 8 15 15-6-3-10-2-13 1Z" fill="#e5484d"/>
            <rect x="17" y="27" width="26" height="6" rx="3" fill="#fbf4e2"/>
            <circle cx="54" cy="30" r="3.6" fill="#fbf4e2"/>
        </svg></span>
        <span class="d-elf wave"><svg viewBox="0 0 120 84">
            <g class="e-arm" style="transform-origin: 36px 86px">
                <path d="M36 86Q25 66 21 47" stroke="#2f9e63" stroke-width="10" stroke-linecap="round"/>
                <circle cx="20" cy="41" r="7" fill="#e5484d"/><circle cx="13.5" cy="44" r="3" fill="#e5484d"/>
            </g>
            <path d="M37 62 22 50l16 21ZM83 62l15-12-16 21Z" fill="#f1cfa6"/>
            <rect x="36" y="52" width="48" height="40" rx="15" fill="#f1cfa6"/>
            <g class="e-eyes" style="transform-origin: 60px 64px">
                <circle cx="50" cy="64" r="3.6" fill="#2b2118"/><circle cx="70" cy="64" r="3.6" fill="#2b2118"/>
                <circle cx="51.2" cy="62.8" r="1.2" fill="#fff"/><circle cx="71.2" cy="62.8" r="1.2" fill="#fff"/>
            </g>
            <path d="M45 57.5q5-3 9 0M66 57.5q5-3 9 0" stroke="#7a5230" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="43" cy="73" r="4" fill="#f08a8a" opacity="0.7"/><circle cx="77" cy="73" r="4" fill="#f08a8a" opacity="0.7"/>
            <path d="M49 72q11 13 22 0Z" fill="#7a2630"/><path d="M55 77q5 4 10 0q-5-3-10 0Z" fill="#f08a8a"/>
            <path d="M34 50c2-24 18-38 40-36 14 1 24 10 26 20-6-4-14-4-18 2 2 4 4 9 4 14Z" fill="#2f9e63"/>
            <rect x="32" y="46" width="56" height="9" rx="4.5" fill="#e5484d"/>
            <circle cx="100" cy="35" r="5" fill="#f2c14e"/><path d="M97 37h6" stroke="#b9853f" stroke-width="1.4"/>
            <rect x="86" y="76" width="18" height="11" rx="5.5" fill="#e5484d"/>
        </svg></span>
        <span class="d-elf gift"><svg viewBox="0 0 120 84">
            <g class="e-gift">
                <rect x="6" y="54" width="36" height="32" rx="2" fill="#5b8def"/>
                <rect x="21.5" y="54" width="5" height="32" fill="#f2c14e"/><rect x="6" y="65" width="36" height="5" fill="#f2c14e"/>
                <path d="M24 54c-9-9-15-3-9 0ZM24 54c9-9 15-3 9 0Z" fill="none" stroke="#f2c14e" stroke-width="2.6"/>
                <circle cx="44" cy="70" r="6" fill="#2f9e63"/><circle cx="5" cy="76" r="6" fill="#2f9e63"/>
            </g>
            <path d="M51 62 38 54l14 18ZM97 62l13-8-14 18Z" fill="#f1cfa6"/>
            <rect x="50" y="52" width="48" height="40" rx="15" fill="#f1cfa6"/>
            <g class="e-eyes" style="transform-origin: 74px 65px">
                <circle cx="64" cy="65" r="5" fill="#fff"/><circle cx="84" cy="65" r="5" fill="#fff"/>
                <circle cx="61.5" cy="66" r="2.8" fill="#2b2118"/><circle cx="81.5" cy="66" r="2.8" fill="#2b2118"/>
            </g>
            <path d="M58 57q5-4 10-1M80 55.5q5-2 9 1" stroke="#7a5230" stroke-width="1.8" stroke-linecap="round"/>
            <g fill="#c98a5e"><circle cx="58" cy="73" r="0.9"/><circle cx="61" cy="75" r="0.9"/><circle cx="87" cy="73" r="0.9"/><circle cx="90" cy="75" r="0.9"/></g>
            <path d="M66 77q8 6 16 0" stroke="#2b2118" stroke-width="2" stroke-linecap="round"/>
            <path d="M72 79.5q2 6 6 0Z" fill="#f08a8a"/>
            <path d="M48 52c3-18 14-32 32-38-2 10 12 20 20 38Z" fill="#e5484d"/>
            <path d="M56 38q17-7 36 3M66 25q10-4 20 0" stroke="#fbf4e2" stroke-width="4"/>
            <circle cx="80" cy="13" r="6" fill="#fbf4e2"/>
            <rect x="46" y="47" width="56" height="9" rx="4.5" fill="#fbf4e2"/>
        </svg></span>
    </div>
    <header class="topbar">
        <h1 class="brand"><span class="brand-dot"></span><span data-i18n="appTitle">World Clock</span></h1>
        <div class="topbar-actions">
        <button type="button" class="icon-btn" id="fullscreen" data-i18n-title="fullscreen" data-i18n-aria="fullscreen" hidden>
            <svg class="fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
            <svg class="fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
        </button>
        <a href="settings.html" class="icon-btn" data-i18n-title="settings" data-i18n-aria="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.66 0-1.25.4-1.51 1Z"/></svg>
        </a>
        </div>
    </header>

    <main class="wrap">
        <section class="clocks" id="clocks"></section>

        <section class="empty" id="empty" hidden>
            <p data-i18n="noPlaces"></p>
            <a href="settings.html" class="btn" data-i18n="addCity"></a>
        </section>

        <section class="planner card" id="planner">
            <div class="planner-head">
                <h2 data-i18n="next24"></h2>
                <div class="selbar" id="selbar" role="toolbar" hidden>
                    <span class="selbar-text" id="selbar-text"></span>
                    <button type="button" class="btn small ghost" id="sel-copy" data-i18n="copyTimes"></button>
                    <button type="button" class="btn small" id="sel-share" data-i18n="shareTime"></button>
                    <button type="button" class="icon-btn small" id="sel-clear" data-i18n-title="clearSel" data-i18n-aria="clearSel">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                    </button>
                </div>
                <ul class="legend">
                    <li><span class="swatch work"></span><span data-i18n="legendWork"></span> <span class="legend-range" id="legend-work"></span></li>
                    <li><span class="swatch edge"></span><span data-i18n="legendEdge"></span></li>
                    <li><span class="swatch night"></span><span data-i18n="legendNight"></span> <span class="legend-range" id="legend-night"></span></li>
                </ul>
            </div>
            <section class="shared" id="shared" hidden>
                <div class="shared-head">
                    <span class="chip accent" data-i18n="sharedTime"></span>
                    <strong class="shared-when" id="shared-when"></strong>
                    <span class="shared-status" id="shared-status"></span>
                    <button type="button" class="icon-btn small" id="shared-close" data-i18n-title="close" data-i18n-aria="close">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                    </button>
                </div>
                <ul class="shared-places" id="shared-places"></ul>
            </section>
            <div class="table-scroll">
                <table id="planner-table" data-i18n-title="copyHint">
                    <thead><tr id="planner-header"></tr></thead>
                    <tbody id="planner-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <dialog class="share-dialog card" id="share-dialog" aria-labelledby="share-title">
        <form method="dialog">
            <h2 id="share-title" data-i18n="shareTitle"></h2>
            <p class="share-span" id="share-span"></p>
            <p class="hint" data-i18n="sharePlacesHint"></p>
            <ul class="share-places" id="share-places"></ul>
            <p class="share-url" id="share-url"></p>
            <div class="share-actions">
                <button type="submit" class="btn small ghost" value="cancel" data-i18n="close"></button>
                <button type="button" class="btn small ghost" id="share-native" data-i18n="shareNative" hidden></button>
                <button type="button" class="btn small" id="share-copy" data-i18n="shareBtn"></button>
            </div>
        </form>
    </dialog>

    <div class="dim" aria-hidden="true"></div>

    <div id="toast" class="toast" role="status" hidden>
        <span id="toast-text"></span>
        <button type="button" class="btn small" id="toast-action" hidden></button>
    </div>

    <script src="i18n.js"></script>
    <script src="common.js"></script>
    <script src="script.js"></script>
</body>
</html>
